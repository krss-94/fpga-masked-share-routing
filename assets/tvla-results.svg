<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="480" fill="#0b0d12"/>
  <rect x="0.5" y="0.5" width="899" height="479" fill="none" stroke="#1c212b"/>

  <!-- title -->
  <text x="80" y="42" font-family="Arial Narrow,'Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="19" fill="#eef0f3">Every tested simulated leakage proxy stayed under threshold</text>
  <text x="80" y="64" font-family="Consolas,monospace" font-size="12" fill="#7d8797">Welch's t-test, worst |t| per trace — simulated proxies only, not a physical power/EM measurement</text>

  <!-- gridlines + y axis (0-5), baseline y=420, unit=64px -->
  <g font-family="Consolas,monospace" font-size="12" fill="#565f6c">
    <g stroke="#171b23" stroke-width="1">
      <path d="M90 420H830 M90 356H830 M90 292H830 M90 228H830 M90 164H830 M90 100H830"/>
    </g>
    <text x="76" y="425" text-anchor="end">0</text>
    <text x="76" y="361" text-anchor="end">1</text>
    <text x="76" y="297" text-anchor="end">2</text>
    <text x="76" y="233" text-anchor="end">3</text>
    <text x="76" y="169" text-anchor="end">4</text>
    <text x="76" y="105" text-anchor="end">5</text>
  </g>
  <text x="34" y="260" font-family="Consolas,monospace" font-size="12" fill="#7d8797" transform="rotate(-90,34,260)" text-anchor="middle">worst |t|</text>

  <!-- threshold line at 4.5 -->
  <path d="M90 132H830" stroke="#e5484d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="835" y="136" font-family="Consolas,monospace" font-size="12" fill="#e5484d">threshold 4.5</text>

  <!-- group divider -->
  <path d="M460 90V420" stroke="#242b36" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="275" y="450" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#5b9bff">Hamming-Weight proxy</text>
  <text x="645" y="450" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#d1a54c">Hamming-Distance proxy</text>

  <!-- HW bars (blue) -->
  <rect x="120" y="341" width="90" height="79" fill="#5b9bff"/>
  <text x="165" y="327" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#c7cdd6">1.24</text>
  <text x="165" y="438" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#a7b0bd">RTL</text>

  <rect x="243" y="338" width="90" height="82" fill="#5b9bff"/>
  <text x="288" y="324" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#c7cdd6">1.28</text>
  <text x="288" y="438" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#a7b0bd">gate-level (no SDF)</text>

  <rect x="366" y="338" width="90" height="82" fill="#7bffb0"/>
  <text x="411" y="324" text-anchor="middle" font-family="Consolas,monospace" font-size="15" font-weight="bold" fill="#7bffb0">1.28</text>
  <text x="411" y="438" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#a7b0bd">gate-level + SDF timing</text>

  <!-- HD bars (gold) -->
  <rect x="494" y="279" width="90" height="141" fill="#d1a54c"/>
  <text x="539" y="265" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#c7cdd6">2.21</text>
  <text x="539" y="438" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#a7b0bd">RTL</text>

  <rect x="617" y="272" width="90" height="148" fill="#d1a54c"/>
  <text x="662" y="258" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#c7cdd6">2.27</text>
  <text x="662" y="438" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#a7b0bd">gate-level (no SDF)</text>

  <rect x="740" y="272" width="90" height="148" fill="#7bffb0"/>
  <text x="785" y="258" text-anchor="middle" font-family="Consolas,monospace" font-size="15" font-weight="bold" fill="#7bffb0">2.27</text>
  <text x="785" y="438" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#a7b0bd">gate-level + SDF timing</text>

  <!-- axis line -->
  <path d="M90 420H830" stroke="#2a303b" stroke-width="1.5"/>

  <!-- footnote -->
  <text x="80" y="472" font-family="Consolas,monospace" font-size="10.5" fill="#4a5260">Green = timing-annotated (SDF) post-route simulation, resolved via the simprims_ver library. All values are simulated proxies; none constitute a physical measurement.</text>
</svg>
