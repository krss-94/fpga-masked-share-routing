<svg width="860" height="500" viewBox="0 0 860 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="860" height="500" fill="#0b0d12"/>
  <rect x="0.5" y="0.5" width="859" height="499" fill="none" stroke="#1c212b"/>

  <!-- title -->
  <text x="80" y="42" font-family="Arial Narrow,'Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="19" fill="#eef0f3">The router's own cost function made it worse. Placement geometry closed it.</text>
  <text x="80" y="64" font-family="Consolas,monospace" font-size="12" fill="#7d8797">avoidable (open_fabric) conflicts, by mitigation strategy — M3 / M3b vs. M3c</text>

  <!-- gridlines + y axis (0-8), baseline y=420, unit=40px -->
  <g font-family="Consolas,monospace" font-size="12" fill="#565f6c">
    <g stroke="#171b23" stroke-width="1">
      <path d="M80 420H820 M80 380H820 M80 340H820 M80 300H820 M80 260H820 M80 220H820 M80 180H820 M80 140H820 M80 100H820"/>
    </g>
    <text x="66" y="425" text-anchor="end">0</text>
    <text x="66" y="385" text-anchor="end">1</text>
    <text x="66" y="345" text-anchor="end">2</text>
    <text x="66" y="305" text-anchor="end">3</text>
    <text x="66" y="265" text-anchor="end">4</text>
    <text x="66" y="225" text-anchor="end">5</text>
    <text x="66" y="185" text-anchor="end">6</text>
    <text x="66" y="145" text-anchor="end">7</text>
    <text x="66" y="105" text-anchor="end">8</text>
  </g>
  <text x="30" y="260" font-family="Consolas,monospace" font-size="12" fill="#7d8797" transform="rotate(-90,30,260)" text-anchor="middle">avoidable conflicts</text>

  <!-- divider between the two phases -->
  <path d="M552 90V420" stroke="#242b36" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="316" y="452" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#565f6c">phase 1 — RWRoute cost-function patch (M3 / M3b)</text>
  <text x="690" y="452" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#565f6c">phase 2 — placement search (M3c)</text>

  <!-- baseline: 3 -->
  <rect x="125" y="300" width="110" height="120" fill="#3a4250"/>
  <text x="180" y="286" text-anchor="middle" font-family="Consolas,monospace" font-size="16" fill="#c7cdd6">3</text>
  <text x="180" y="440" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#a7b0bd">baseline</text>

  <!-- soft penalty: 6 -->
  <rect x="305" y="180" width="110" height="240" fill="#3a4250"/>
  <text x="360" y="166" text-anchor="middle" font-family="Consolas,monospace" font-size="16" fill="#c7cdd6">6</text>
  <text x="360" y="440" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#a7b0bd">soft penalty</text>

  <!-- hard exclusion: 7, the alarming outcome -->
  <rect x="485" y="140" width="110" height="280" fill="#e5484d"/>
  <text x="540" y="126" text-anchor="middle" font-family="Consolas,monospace" font-size="16" font-weight="bold" fill="#e5484d">7</text>
  <text x="540" y="440" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#a7b0bd">hard exclusion</text>

  <!-- callout on the phase-1 peak -->
  <path d="M620,170 C 650,140 610,125 580,122" fill="none" stroke="#e5484d" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="625" y="170" font-family="Consolas,monospace" font-size="12" fill="#e5484d">tighter constraint,</text>
  <text x="625" y="186" font-family="Consolas,monospace" font-size="12" fill="#e5484d">more conflicts</text>

  <!-- M3c: hand-tuned placement search, 3 -> 4 -> 2 -> 1 -> 0 -->
  <rect x="665" y="416" width="110" height="4" fill="#7bffb0"/>
  <text x="720" y="404" text-anchor="middle" font-family="Consolas,monospace" font-size="16" font-weight="bold" fill="#7bffb0">0</text>
  <text x="720" y="440" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#a7b0bd">placement search</text>
  <text x="720" y="466" text-anchor="middle" font-family="Consolas,monospace" font-size="10.5" fill="#565f6c">(hand-tuned, 4 steps: 3→4→2→1→0)</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#e5484d"/>
    </marker>
  </defs>

  <!-- axis line -->
  <path d="M80 420H820" stroke="#2a303b" stroke-width="1.5"/>

  <!-- footnote: what M3c did not touch -->
  <text x="80" y="486" font-family="Consolas,monospace" font-size="10.5" fill="#4a5260">Closes every avoidable conflict on this checkpoint. 2 co-located-terminal conflicts remain — structural, untouched by either phase. Does not change the phase-1 finding.</text>
</svg>
